services:

  web:
    image: ghcr.io/pppberlin/website-stumpfmeista3d:latest
    build: .
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:////data/stumpfmeista3d.db
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SITE_URL=${SITE_URL}
      - MATOMO_URL=${MATOMO_URL}
      - MATOMO_SITE_ID=${MATOMO_SITE_ID}
    volumes:
      - db_data:/data
      - uploads:/app/uploads
    command: >
      /bin/sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 2 app:app"
    expose:
      - "5000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # Matomo Analytics
  # ---------------------------------------------------------------------------
  matomo_db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=${MATOMO_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MATOMO_DB_ROOT_PASSWORD}
    volumes:
      - matomo_db:/var/lib/mysql
    command: --max-allowed-packet=64MB

  matomo:
    image: matomo:5
    restart: unless-stopped
    depends_on:
      - matomo_db
    environment:
      - MATOMO_DATABASE_HOST=matomo_db
      - MATOMO_DATABASE_DBNAME=matomo
      - MATOMO_DATABASE_USERNAME=matomo
      - MATOMO_DATABASE_PASSWORD=${MATOMO_DB_PASSWORD}
    volumes:
      - matomo_data:/var/www/html
    expose:
      - "80"

  # ---------------------------------------------------------------------------
  # Caddy — interner Reverse Proxy (HTTP only, SSL via Cloudflare Tunnel)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Nur auf localhost binden — kein direkter Internetzugang, nur via Tunnel
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - matomo

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: web

volumes:
  db_data:
  uploads:
  matomo_db:
  matomo_data:
  caddy_data:
  caddy_config:
